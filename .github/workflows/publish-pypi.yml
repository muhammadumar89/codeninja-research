# Publishes hyper-ontology-py to PyPI with trusted publishing (no API token stored anywhere).
# Release: bump version in hyper-ontology-py/pyproject.toml, then push a tag hyper-ontology-v<version>.
# One-time setup on pypi.org (account owner): Publishing > Add a pending publisher >
#   project hyper-ontology, owner muhammadumar89, repo codeninja-research,
#   workflow publish-pypi.yml, environment pypi.
name: publish-pypi
on:
  push:
    tags: ["hyper-ontology-v*"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install build
      - run: python -m build hyper-ontology-py --outdir dist
      - run: pip install dist/*.whl && hyper-ontology list | head -3
      - uses: actions/upload-artifact@v4
        with: {name: dist, path: dist/}
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with: {name: dist, path: dist/}
      - uses: pypa/gh-action-pypi-publish@release/v1
